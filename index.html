<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ใบสั่งซื้อ SKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --green: #06C755; --green-d: #05a346; --blue: #1A56B8; --red: #D93025; --amber: #8A6100; --pink: #8E2463;
    --bg: #F2F4F5; --card: #FFFFFF; --text: #1F2328; --muted: #6B7280; --line: #E5E7EB; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 'Sarabun', 'Noto Sans Myanmar', 'Noto Sans Khmer', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--green); color: #fff;
    padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  header.blue { background: var(--blue); } header.purple { background: #534AB7; }
  header .back { border: 0; background: #fff3; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; }
  header img { width: 34px; height: 34px; border-radius: 50%; background: #fff3; object-fit: cover; }
  header .t { font-weight: 700; font-size: 17px; line-height: 1.2; }
  header .s { font-size: 13px; opacity: .9; }
  main { padding: 12px 12px 120px; max-width: 680px; margin: 0 auto; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px #0000000d; }
  .card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .req { color: var(--red); font-weight: 400; font-size: 13px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--text); min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  textarea { min-height: 60px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .invalid { border-color: var(--red) !important; background: #FFF6F5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; background: #fff; cursor: pointer; user-select: none; }
  .chip.on { background: var(--green); border-color: var(--green); color: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px;
    font: inherit; font-weight: 600; padding: 12px 16px; cursor: pointer; min-height: 44px; text-decoration: none; }
  .btn.full { width: 100%; }
  .btn.ghost { background: #EEF9F2; color: var(--green-d); }
  .btn.line { background: #fff; border: 1px solid var(--line); color: var(--text); }
  .btn.camera { background: #fff; border: 2px dashed #B8C2CC; color: var(--text); width: 100%; min-height: 64px; }
  .btn.primary { background: var(--green); color: #fff; font-size: 17px; min-height: 52px; }
  .btn.blue { background: var(--blue); color: #fff; } .btn.red { background: var(--red); color: #fff; }
  .btn:disabled { opacity: .5; }
  .actions { display: grid; gap: 8px; }
  .actions.two { grid-template-columns: 1fr 1fr; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .warn { font-size: 13px; color: var(--amber); background: #FFF4CE; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .info { font-size: 13px; color: var(--blue); background: #EEF4FF; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .flags { background: #FDECEA; color: #B3261E; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
  .flags b { display: block; margin-bottom: 2px; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #ddd; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: #000a; color: #fff; font-size: 16px; cursor: pointer; }
  .thumb a { display: block; height: 100%; }
  .mini { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .gps { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #EEF2F6; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .gps.ok { background: #E8F7EE; color: var(--green-d); } .gps.bad { background: #FDECEA; color: var(--red); cursor: pointer; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #fffffff2; border-top: 1px solid var(--line); z-index: 5; }
  .bar .inner { max-width: 680px; margin: 0 auto; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; white-space: pre-line; word-break: break-word; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .s-wait { background: #FFF4CE; color: var(--amber); } .s-buy { background: #E8F0FE; color: var(--blue); }
  .s-settle { background: #FCE8F3; color: var(--pink); } .s-ok { background: #DFF6E3; color: #1B7A35; }
  .s-bad { background: #FDE2E1; color: #B3261E; } .s-gray { background: #EEE; color: #666; }
  .group { margin: 18px 4px 6px; font-size: 14px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; }
  .po { display: block; background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; box-shadow: 0 1px 2px #0000000d; }
  .po .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .po .id { font-weight: 700; } .po .v { font-size: 14px; } .po .m { font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 18px; font-size: 14px; }
  table.items { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.items th, table.items td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.items th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .r { text-align: right !important; } .ok { color: var(--green-d); font-weight: 600; } .bad { color: var(--red); font-weight: 600; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; position: relative; }
  .item .g3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .item .del { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: var(--muted); font-size: 22px; width: 34px; height: 34px; cursor: pointer; }
  .item .name { padding-right: 38px; }
  .item .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; padding-right: 4px; }
  .item .head span { color: var(--muted); font-weight: 400; white-space: nowrap; }
  .item .res { font-size: 13px; text-align: right; margin-top: 6px; }
  .total { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .total input { max-width: 170px; text-align: right; font-weight: 700; font-size: 18px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--text); margin: 12px 0 0; cursor: pointer; }
  .check input { width: 22px; height: 22px; min-height: 0; margin-top: 2px; flex: none; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg .chip { text-align: center; border-radius: 10px; }
  .seg .chip.on.bad { background: var(--red); border-color: var(--red); }
  /* หน้าผู้ไปซื้อ — ปุ่มใหญ่ ไอคอนใหญ่ */
  .lang { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .lang .chip { font-size: 15px; padding: 8px 16px; }
  .step { display: flex; gap: 14px; align-items: center; }
  .step .ic { font-size: 40px; width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; background: #F2F4F5; border-radius: 14px; }
  .step .tx { font-size: 18px; font-weight: 700; line-height: 1.35; }
  .step .sub { font-size: 14px; color: var(--muted); font-weight: 400; }
  .step.done .ic { background: #E8F7EE; }
  .bigcam { width: 100%; min-height: 84px; font-size: 20px; border-radius: 14px; margin-top: 12px; }
  .job { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer; border: 2px solid var(--green); }
  .job .ic { font-size: 44px; } .job .v { font-size: 20px; font-weight: 700; } .job .m { color: var(--muted); font-size: 14px; }
  .cash { font-size: 22px; font-weight: 700; color: var(--blue); }
  .overlay { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 20; color: #fff; flex-direction: column; gap: 14px; padding: 24px; text-align: center; }
  .overlay.show { display: flex; }
  .spin { width: 44px; height: 44px; border: 4px solid #fff4; border-top-color: #fff; border-radius: 50%; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .done { text-align: center; padding: 36px 16px; }
  .done .ic { font-size: 64px; } .done h1 { font-size: 22px; margin: 8px 0; }
  .done .id { font-size: 26px; font-weight: 700; margin: 6px 0 16px; }
  .done .btn { margin-top: 10px; width: 100%; }
  .mock { background: #FFF4CE; color: var(--amber); font-size: 13px; text-align: center; padding: 6px; }
  .mock .roles { display: inline-flex; gap: 6px; margin-left: 4px; }
  .mock button { font: inherit; font-size: 13px; border: 1px solid #E0C36A; background: #fff; color: var(--amber); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .mock button.on { background: var(--amber); border-color: var(--amber); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: 90vw; display: none; }
  .toast.show { display: block; }
  .center { text-align: center; padding: 60px 16px; color: var(--muted); }
  .logrow { display: grid; grid-template-columns: 118px 1fr; gap: 8px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .logrow:last-child { border-bottom: 0; }
  .logrow .lt { color: var(--muted); font-size: 12px; padding-top: 2px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="mockBar" class="mock hidden">โหมดทดสอบ — ดูในบทบาท:
  <span class="roles"><button data-as="clerk">เสมียน</button><button data-as="exec">ผู้บริหาร</button><button data-as="buyer">ผู้ไปซื้อ</button></span></div>
<header id="hdr">
  <button class="back hidden" id="backBtn" aria-label="กลับ">‹</button>
  <img id="avatar" alt="">
  <div><div class="t" id="hdrTitle">ใบสั่งซื้อ SKS</div><div class="s" id="hdrName">กำลังโหลด…</div></div>
</header>
<main id="app"><div class="center">กำลังโหลด…</div></main>
<div class="bar hidden" id="bar"><div class="inner"><button class="btn primary full" id="submitBtn">บันทึก</button></div></div>

<div class="overlay" id="overlay"><div class="spin"></div><div id="overlayText">กำลังส่ง…</div></div>
<div class="toast" id="toast"></div>

const ST = { WAIT_A1: 'รออนุมัติสั่งซื้อ', WAIT_CASH1: 'รอการเงินจ่ายเงินเบิก', TO_BUY: 'อนุมัติแล้ว รอซื้อ',

const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = (n) => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const t = (k) => (L[state.lang] || L.th)[k] || L.th[k];
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el[k] = v; else if (k === 'html') el.innerHTML = v; else el.setAttribute(k, v);
  });
  kids.flat().forEach((c) => c != null && el.append(c instanceof Node ? c : String(c)));
  return el;
}
function toast(msg, ms = 3000) {

  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);

/** ป้ายสถานะ — ส่งใบทั้งใบมาเพื่อให้ใบซ่อมใช้คำของงานซ่อม */
function badge(r) { const s = typeof r === 'string' ? { status: r } : r; return h('span', { class: 'badge ' + (ST_CLASS[s.status] || 's-gray') }, stText(s)); }

}

/* ================== API ================== */
async function api(action, extra = {}) {
  if (MOCK) return mockApi(action, extra);
  const res = await fetch(GAS_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, idToken: liff.getIDToken(), ...extra }),
  });
  const data = await res.json();
  if (!data.ok) {
    // ยืนยันตัวตนไม่ผ่าน (token หมดอายุระหว่างใช้งาน) → ล็อกอินใหม่ 1 ครั้ง ไม่วนซ้ำ
    if (/ยืนยันตัวตน|ข้อมูลยืนยันตัวตน/.test(data.error || '') && !liff.isInClient() && sessionGet('relogin') !== '1') {
      sessionSet('relogin', '1'); relogin(); return new Promise(() => {});
    }
    throw new Error(data.error || 'เกิดข้อผิดพลาด');
  }
  sessionSet('relogin', '');
  return data;
}
function idTokenFresh() {
  try { const d = liff.getDecodedIDToken(); return !!d && d.exp * 1000 > Date.now() + 60000; } catch (_) { return false; }
}
function relogin() {
  try { liff.logout(); } catch (_) { /* ไม่สำคัญ */ }
  liff.login({ redirectUri: location.href });
}
function sessionGet(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } }
function sessionSet(k, v) { try { sessionStorage.setItem(k, v); } catch (_) { /* ไม่สำคัญ */ } }

/* ================== เริ่มต้น + เปลี่ยนหน้า ================== */
async function init() {
  try {
    if (MOCK) {
      $('mockBar').classList.remove('hidden');
      document.querySelectorAll('#mockBar [data-as]').forEach((b) => (b.onclick = () => mockSwitch(b.dataset.as)));
      mockProfile();
    } else {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      // เปิดในเบราว์เซอร์บนคอม (LINE PC): LIFF เก็บ ID token ไว้ในเบราว์เซอร์ หมดอายุแล้วจะยืนยันตัวตนไม่ผ่าน → ล็อกอินใหม่ให้เอง
      if (!liff.isInClient() && !idTokenFresh()) { relogin(); return; }
      state.profile = await liff.getProfile();
      qs = new URLSearchParams(location.search); // อ่านหลัง liff.init (LIFF ส่งพารามิเตอร์มาผ่าน liff.state)
    }
    if (state.profile.pictureUrl) $('avatar').src = state.profile.pictureUrl; else $('avatar').style.display = 'none';
    // โหลด me กับ list พร้อมกัน — เดิมรอทีละอัน ทำให้เปิดหน้าแรกช้าเป็นสองเท่า
    const mePromise = api('me');
    state.preList = api('list').catch(() => null);
    state.me = await mePromise;
    state.lang = state.me.user.lang || localGet('lang') || 'th';
    startVerWatch();
    $('backBtn').onclick = () => history.back();
    window.onpopstate = (e) => route(e.state || { view: 'home' }, false);
    const mode = qs.get('mode');
    const first = mode ? { view: mode, id: qs.get('id') || '' } : { view: 'home' };
    if (first.view !== 'home') {
      try { history.replaceState({ view: 'home' }, '', location.pathname + (MOCK ? location.search.replace(/[&?](mode|id)=[^&]*/g, '') : '')); } catch (_) { /* ไม่สำคัญ */ }
    }
    await route(first, first.view !== 'home');
  } catch (err) { showError(err); }
}

/* ---------- รีเฟรชอัตโนมัติ ----------
 * เปิดหน้าค้างไว้บนคอม แล้วมีคนอื่นอนุมัติ/ตรวจรับ/จ่ายเงิน → หน้าจอโหลดรายการใหม่ให้เอง
 * เช็คแค่ "เลขรุ่นข้อมูล" ตัวเดียว (เบามาก) และรีเฟรชเฉพาะหน้ารายการกับหน้าใบ ไม่รบกวนตอนกรอกฟอร์ม
 */
let verTimer = null, lastVer = '';
function startVerWatch() {
  if (MOCK || verTimer) return;
  lastVer = state.me.ver || '';
  verTimer = setInterval(checkVer, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVer(); });
  window.addEventListener('focus', checkVer);
}
async function checkVer() {
  if (document.hidden) return;
  if (state.view !== 'home' && state.view !== 'po') return;          // กำลังกรอกฟอร์มอยู่ อย่าเพิ่งโหลดทับ
  if ($('overlay').classList.contains('show')) return;               // กำลังบันทึกอยู่
  try {
    const v = (await (await fetch(GAS_URL + '?ver=1', { cache: 'no-store' })).text()).trim();
    if (!v || v === '0' || v === lastVer) return;
    lastVer = v;
    await route({ view: state.view, id: state.id }, false);
    toast('🔄 มีรายการเปลี่ยนแปลง — อัปเดตให้แล้ว', 3000);
  } catch (_) { /* เน็ตสะดุด เดี๋ยวรอบหน้าเช็คใหม่ */ }
}

async function go(view, id) { await route({ view, id }, true); }
async function route(s, push) {
  if (push) {
    try { history.pushState(s, '', '?' + new URLSearchParams({ ...(MOCK ? { mock: '', as: qs.get('as') || 'clerk' } : {}), mode: s.view, ...(s.id ? { id: s.id } : {}) })); }
    catch (_) { try { history.pushState(s, ''); } catch (__) { /* หน้าทดสอบแบบ data: URL */ } }
  }
  state.view = s.view; state.id = s.id || ''; state.photos = { bill: [], goods: [], recv: [], before: [], oldpart: [] };
  setBar('', null); scrollTo(0, 0);
  $('app').innerHTML = '<div class="center">กำลังโหลด…</div>';
  try {
    const views = { home: viewHome, create: viewCreate, po: viewPO, buy: viewBuy, receive: viewReceive };
    await (views[s.view] || viewHome)();
  } catch (err) { showError(err); }
}
function showError(err) {
  $('app').innerHTML = ''; setBar('', null);
  $('app').append(h('div', { class: 'center' }, '⚠️ ' + (err.message || err)));
}
function localGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* ไม่สำคัญ */ } }

/* ================== หน้าแรก (แยกตามบทบาท) ================== */
async function viewHome() {
  const u = state.me.user;
  const officer = u.isClerk || u.isExec;
  header(officer ? 'ระบบใบสั่งซื้อ SKS' : t('jobs'), `${state.profile.displayName} · ${u.role || 'ผู้ซื้อ'}`);
  const pre = state.preList; state.preList = null; // ใช้ผลที่โหลดคู่ไปกับ me ตอนเปิดระบบ (ครั้งแรกเท่านั้น)
  const data = (pre && await pre) || await api('list');
  const app = $('app'); app.innerHTML = '';

  if (!officer || data.jobs.length) {
    app.append(langSwitch(() => route({ view: 'home' }, false)));
    app.append(h('div', { class: 'group' }, '🛒 ' + t('jobs')));
    if (!data.jobs.length) app.append(h('div', { class: 'card empty', style: 'font-size:18px' }, t('none')));
    data.jobs.forEach((p) => app.append(h('div', { class: 'job', onclick: () => go('buy', p.id) },
      h('div', { class: 'ic' }, kw(p).ic),
      h('div', {}, h('div', { class: 'v' }, p.vendor), h('div', { class: 'm' }, `${p.id} · ${t('tap')} ›`)))));
  }

  if (u.isClerk) app.append(h('button', { class: 'btn primary full', style: 'margin:8px 0 4px', onclick: () => go('create') }, '+ สร้างใบใหม่ (ซื้อของ / ส่งซ่อม)'));

  if (officer) {
    const groups = [
      [ST.WAIT_A2, u.isExec ? '✍️ รอปิดรายการ — แตะเพื่อปิด' : '✍️ รอปิดรายการ (รอผู้บริหาร)'],
      [ST.WAIT_A1, u.isExec ? '🕐 รออนุมัติ — แตะเพื่ออนุมัติ' : '🕐 รออนุมัติ (รอผู้บริหาร)'],
      ['print', '🖨️ อนุมัติแล้ว — รอพิมพ์ใบ'],
      ['bought', '📦 ซื้อแล้ว — รอตรวจรับ'],
      ['repairing', '🔧 อยู่ระหว่างซ่อม — รอรับคืน / ตรวจงาน'],
      ['tobuy', '🛒 พิมพ์แล้ว — รอไปซื้อ / รอส่งซ่อม / รอช่าง'],
      [ST.WAIT_SETTLE, '💵 รอเคลียร์เงิน'],
    ];
    const pick = (k) => data.open.filter((p) => k === 'print' ? p.status === ST.TO_BUY && !p.prints
      : k === 'tobuy' ? p.status === ST.TO_BUY && p.prints
      : k === 'bought' ? p.status === ST.BOUGHT && !isRepair(p)
      : k === 'repairing' ? p.status === ST.BOUGHT && isRepair(p) : p.status === k);
    groups.forEach(([k, title]) => {
      const list = pick(k);
      app.append(h('div', { class: 'group' }, h('span', {}, title), h('span', {}, String(list.length))));
      if (!list.length) app.append(h('div', { class: 'empty' }, '—'));
      list.forEach((p) => app.append(poRow(p)));
    });
    if (data.recent.length) {
      app.append(h('div', { class: 'group' }, 'รายการที่จบแล้ว (ล่าสุด)'));
      data.recent.forEach((p) => app.append(poRow(p)));
    }
  } else if (data.myRecent.length) {
    app.append(h('div', { class: 'group' }, t('myRecent')));
    data.myRecent.forEach((p) => app.append(poRow(p)));
  }

function poRow(p) {

  const away = isRepair(p) && p.status === ST.BOUGHT && p.days != null
    ? h('span', { class: p.days >= 14 ? 'bad' : '' }, ` · ${p.kind === KIND.SHOP ? 'อยู่ร้าน' : 'เริ่มซ่อมมา'} ${p.days} วัน`) : null;
  return h('div', { class: 'po', onclick: () => go('po', p.id) },
    h('div', { class: 'r1' }, h('span', { class: 'id' }, (p.flagged ? '⚠️ ' : '') + (isRepair(p) ? w.ic + ' ' : '') + p.id), badge(p)),
    h('div', { class: 'v' }, p.vendor),
    h('div', { class: 'm' }, [p.buyer && `${w.person} ${p.buyer}`, p.payment, money, p.created].filter(Boolean).join(' · '), away));
}

  const blank = () => (repair ? { name: '', qty: '1', unit: 'เครื่อง', asset: '' } : { name: '', qty: '', unit: '', asset: '' });
  const f = { payment: PAY.CREDIT, items: [blank()] };

    }, `${KW[k].ic} ${k}`))),
    repair ? h('div', { class: 'hint' }, kind === KIND.SHOP
      ? 'ขั้นตอน: อนุมัติ → พิมพ์ใบส่งซ่อม → ถ่ายรูปก่อนซ่อมตอนนำของออก → รับของคืน: รูปหลังซ่อม + อะไหล่เก่า + ผลทดสอบ + ราคาจากบิล'
      : 'ขั้นตอน: อนุมัติ → พิมพ์ใบสั่งงาน → ถ่ายรูปก่อนช่างเริ่ม → ตรวจงาน: รูปหลังซ่อม + อะไหล่เก่า + ผลทดสอบ + ราคาจากบิล') : null));

  const vendor = h('input', { id: 'vendor', list: 'vendorList', placeholder: repair ? 'เลือกหรือพิมพ์ชื่อร้านซ่อม / ช่าง' : 'เลือกหรือพิมพ์ชื่อร้าน', autocomplete: 'off' });
  const vlist = h('datalist', { id: 'vendorList' }, ...m.vendors.map((v) => h('option', { value: v.name })));
  const vhint = h('div', { class: 'hint' });
  const dept = h('select', { id: 'dept' }, h('option', { value: '' }, '— เลือกแผนก —'), ...m.departments.map((d) => h('option', { value: d }, d)));
  const buyer = h('select', { id: 'buyer' }, h('option', { value: '' }, `— เลือก${w.person} —`), ...m.buyers.map((b) => h('option', { value: b.id }, b.name)));
  const chips = h('div', { class: 'chips' });
  const advWrap = h('div', { class: 'hidden' }, h('label', { for: 'advance' }, 'ยอดเงินที่เบิกล่วงหน้า (บาท) *'),
    h('input', { id: 'advance', type: 'number', inputmode: 'decimal', min: '0', step: '0.01', placeholder: '0.00' }),
    h('div', { class: 'hint' }, 'ผู้บริหารเห็นยอดนี้ตอนอนุมัติ · ตอนปิดรายการระบบคำนวณเงินทอนให้'));
  const setPay = (p) => {
    f.payment = p; [...chips.children].forEach((c) => c.classList.toggle('on', c.textContent === p));
    advWrap.classList.toggle('hidden', p !== PAY.ADVANCE);
  };
  m.payments.forEach((p) => chips.append(h('div', { class: 'chip', onclick: () => setPay(p) }, p)));
  setPay(PAY.CREDIT);
  vendor.oninput = () => {
    vendor.classList.remove('invalid');
    const v = m.vendors.find((x) => x.name === vendor.value.trim());
    if (v) { setPay(v.payment); vhint.textContent = `วิธีชำระประจำร้าน: ${v.payment} (เปลี่ยนได้)`; }
    else vhint.textContent = vendor.value.trim() ? 'ร้านใหม่ — ระบบจะเพิ่มลงรายชื่อร้านให้' : '';
  };

  const itemsBox = h('div', { id: 'items' });
  const ilist = h('datalist', { id: 'itemList' }, ...m.itemNames.map((n) => h('option', { value: n })));
  const renderItems = () => {
    itemsBox.innerHTML = '';
    f.items.forEach((it, i) => {
      const name = h('input', { class: 'name', list: 'itemList', placeholder: repair ? `ของที่จะซ่อม เช่น มอเตอร์ 5HP เครื่องไส` : `รายการที่ ${i + 1}`, value: it.name });
      const qty = h('input', { class: 'qty', type: 'number', inputmode: 'decimal', min: '0', step: 'any', placeholder: 'จำนวน', value: it.qty });
      const unit = h('input', { class: 'unit', placeholder: 'หน่วย เช่น ตัว เส้น กล่อง', value: it.unit });
      const asset = repair ? h('input', { class: 'asset', placeholder: 'เลขเครื่อง / ทะเบียนทรัพย์สิน (ถ้ามี)', value: it.asset }) : null;
      [name, qty, unit, asset].filter(Boolean).forEach((x) => (x.oninput = () => {
        x.classList.remove('invalid'); it.name = name.value; it.qty = qty.value; it.unit = unit.value; if (asset) it.asset = asset.value;
      }));
      itemsBox.append(h('div', { class: 'item' }, name, asset, h('div', { class: 'g3' }, qty, unit),
        f.items.length > 1 ? h('button', { type: 'button', class: 'del', 'aria-label': 'ลบรายการ', onclick: () => { f.items.splice(i, 1); renderItems(); } }, '×') : null));
    });
  };
  renderItems();
  const note = h('textarea', { id: 'note', placeholder: repair ? 'เช่น มอเตอร์มีเสียงดัง เดินไม่ขึ้น ร้อนจัด' : 'เช่น ซ่อมสายพานเครื่องไสไม้' });

  app.append(
    h('section', { class: 'card' }, h('h2', {}, (repair ? '🔧 ' : '🏪 ') + w.vendor), vendor, vlist, vhint,
      h('div', { class: 'row2' }, h('div', {}, h('label', {}, 'แผนกที่ใช้'), dept), h('div', {}, h('label', {}, w.person + ' *'), buyer)),
      h('div', { class: 'hint' }, `ไม่มีชื่อ${w.person}? ให้เขาเพิ่มเพื่อน LINE ของบริษัทก่อน ชื่อจะขึ้นอัตโนมัติ`)),
    h('section', { class: 'card' }, h('h2', {}, '💵 วิธีชำระ'), chips, advWrap),
    h('section', { class: 'card' }, h('h2', {}, repair ? '🔧 ของที่จะซ่อม ' : '📦 รายการที่จะสั่ง ', h('span', { class: 'req' }, '* ไม่ต้องใส่ราคา')), itemsBox, ilist,
      h('button', { type: 'button', class: 'btn ghost full', onclick: () => { f.items.push(blank()); renderItems(); itemsBox.lastChild.querySelector('.name').focus(); } }, '+ เพิ่มรายการ')),
    h('section', { class: 'card' }, h('label', { for: 'note' }, repair ? 'อาการเสีย / หมายเหตุ *' : 'เหตุผลที่ซื้อ / หมายเหตุ'), note),
  );

  setBar('ส่งขออนุมัติ' + w.ask, async () => {
    document.querySelectorAll('.invalid').forEach((x) => x.classList.remove('invalid'));
    const errs = []; let first = null;
    const bad = (el, msg) => { el.classList.add('invalid'); errs.push(msg); first = first || el; };
    if (!vendor.value.trim()) bad(vendor, w.vendor);
    if (!buyer.value) bad(buyer, w.person);
    if (repair && !note.value.trim()) bad(note, 'อาการเสีย');
    if (f.payment === PAY.ADVANCE && !(Number($('advance').value) > 0)) bad($('advance'), 'ยอดเบิก');
    const rows = itemsBox.querySelectorAll('.item');
    const filled = f.items.filter((it) => it.name.trim());
    if (!filled.length) bad(rows[0].querySelector('.name'), 'รายการ');
    if (filled.length > 15) return toast('ใบหนึ่งใส่ได้ไม่เกิน 15 รายการ (ให้พอดีครึ่งแผ่น A4) — แยกเป็น 2 ใบ', 5000);
    f.items.forEach((it, i) => { if (it.name.trim() && !(Number(it.qty) > 0)) bad(rows[i].querySelector('.qty'), 'จำนวน'); });
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('กรุณาใส่: ' + [...new Set(errs)].join(', '), 4000); }
    $('submitBtn').disabled = true; overlay(true, 'กำลังส่งขออนุมัติ…');
    try {
      const res = await api('create', { data: {
        kind, vendor: vendor.value.trim(), department: dept.value, buyerId: buyer.value, payment: f.payment,
        advance: f.payment === PAY.ADVANCE ? Number($('advance').value) : 0, note: note.value.trim(),
        items: filled.map((it) => ({ name: it.name.trim(), qty: Number(it.qty), unit: it.unit.trim(), asset: (it.asset || '').trim() })),
      } });
      showDone('📨', 'ส่งขออนุมัติแล้ว', res.id, res.notified ? 'ส่งการ์ดให้ผู้บริหารใน LINE แล้ว\nเมื่ออนุมัติ ใบนี้จะขึ้นในกลุ่ม "รอพิมพ์ใบ"' : 'บันทึกแล้ว (ยังไม่ได้แจ้งผู้บริหาร — ตรวจชีต Staff)', 'สร้างใบใหม่', () => go('create'));
    } catch (err) { toast('ส่งไม่สำเร็จ: ' + err.message, 5000); }
    finally { overlay(false); $('submitBtn').disabled = false; }
  });
}

/* ================== รายละเอียดใบสั่งซื้อ + ปุ่มตามสิทธิ์ ================== */
async function viewPO() {
  const res = await api('get', { id: state.id });
  const r = state.record = res.record; const can = res.can;
  header(r.id, r.vendor, r.status === ST.WAIT_A2 || r.status === ST.WAIT_A1 ? 'purple' : '');
  const app = $('app'); app.innerHTML = '';
  const kv = (pairs) => h('dl', { class: 'kv' }, ...pairs.filter((p) => p[1] !== '' && p[1] != null).flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]));

  const w = kw(r); const repair = isRepair(r);
  app.append(h('section', { class: 'card' },
    h('h2', {}, r.id, badge(r)),
    kv([['ประเภท', `${w.ic} ${r.kind || KIND.BUY}`], [w.vendor, r.vendor], ['แผนก', r.dept], [w.person, r.buyer], ['วิธีชำระ', r.payment],
      ['เบิกล่วงหน้า', r.payment === PAY.ADVANCE ? fmt(r.advance) + ' บาท' : ''], ['ผู้จัดทำ', `${r.creator} · ${r.created}`],
      [repair ? 'อาการเสีย' : 'เหตุผล', r.note], ['อนุมัติ' + w.ask, r.a1By ? `${r.a1By} · ${r.a1At}` : ''], ['ใช้ได้ถึง', r.validUntil],
      ['พิมพ์แล้ว', r.a1By ? `${r.prints} ครั้ง` : ''], [repair ? (r.kind === KIND.SHOP ? 'นำของออกไปซ่อม' : 'ช่างเริ่มซ่อม') : 'ส่งรูปจากร้าน', r.boughtAt],
      ['เลขที่บิลร้าน', r.billNo], ['ยอดตามบิล', r.receivedAt ? fmt(r.total) + ' บาท' : ''],
      ['ตรวจรับ', r.receiver ? `${r.receiver} · ${r.receivedAt}` : ''], ['ผลตรวจรับ', r.result],
      ['ผลทดสอบหลังซ่อม', r.test ? h('b', { class: r.test === 'ใช้งานได้' ? 'ok' : 'bad' }, r.test) : ''], ['หมายเหตุตรวจรับ', r.recvNote],
      ['จ่ายเงินเบิก', r.advBy ? `${r.advBy} · ${r.advAt}` : ''],
      ['ปิดรายการ', r.a2By ? `${r.a2By} · ${r.a2At}` : ''], ['การเงิน', r.settle], ['เคลียร์เงิน', r.settleBy ? `${r.settleBy} · ${r.settleAt}` : '']]),
    flagsBox(r.flags)));

  const received = r.items.some((it) => it.received != null);
  app.append(h('section', { class: 'card' }, h('h2', {}, repair ? '🔧 รายการซ่อม' : '📦 รายการ'),
    h('table', { class: 'items' },
      h('tr', {}, h('th', {}, 'รายการ'), h('th', { class: 'r' }, repair ? 'ส่ง' : 'สั่ง'), received ? h('th', { class: 'r' }, repair ? 'คืน' : 'รับ') : null, received ? h('th', { class: 'r' }, 'บาท') : null),
      ...r.items.map((it) => h('tr', {},
        h('td', {}, it.name + (it.asset ? ` [${it.asset}]` : '') + (it.extra ? (repair ? ' (ค่าซ่อม/อะไหล่)' : ' (นอกใบสั่ง)') : '')),
        h('td', { class: 'r' }, it.extra ? '-' : `${fmtN(it.qty)} ${it.unit}`),
        received ? h('td', { class: 'r ' + (it.result === 'ครบ' ? 'ok' : 'bad') }, it.received == null ? '-' : fmtN(it.received)) : null,
        received ? h('td', { class: 'r' }, it.amount ? fmt(it.amount) : '-') : null)))));

  // ใบซ่อม: เรียงรูปก่อน-หลังซ่อมไว้ติดกัน ให้ผู้บริหารเทียบได้ทันที
  const photos = (repair
    ? [['รูปก่อนซ่อม', r.beforeImages || []], ['รูปหลังซ่อม', r.recvImages], ['รูปอะไหล่เก่าที่ถอดออก', r.oldPartImages || []], ['รูปบิล/ใบเสร็จค่าซ่อม', r.billImages]]
    : [['รูปบิลร้าน', r.billImages], ['รูปของที่ร้าน', r.goodsImages], ['รูปตอนรับของ', r.recvImages]]).filter((p) => p[1].length);
  if (photos.length || r.noParts) app.append(h('section', { class: 'card' }, h('h2', {}, '📸 รูปหลักฐาน'),
    ...photos.flatMap(([label, list]) => [h('div', { class: 'mini' }, label), linkThumbs(list)]),
    r.noParts ? h('div', { class: 'hint' }, '🔩 เสมียนระบุว่า: ไม่มีการเปลี่ยนอะไหล่') : null,
    r.gps ? h('div', { class: 'hint' }, h('a', { href: r.gps.split(' ').pop(), target: '_blank' }, repair ? '📍 ดูตำแหน่งตอนถ่ายรูปก่อนซ่อม' : '📍 ดูตำแหน่งที่ร้านบนแผนที่')) : null));

  // ปุ่มตามสิทธิ์
  const acts = h('div', { class: 'actions' });
  const run = async (action, extra, text) => {
    overlay(true, text || 'กำลังบันทึก…');
    try { const x = await api(action, { id: r.id, ...extra }); toast(x.message || 'บันทึกแล้ว', 4000); await route({ view: 'po', id: r.id }, false); }
    catch (err) { toast(err.message, 5000); } finally { overlay(false); }
  };
  if (can.approve1) acts.append(h('div', { class: 'actions two' },
    h('button', { class: 'btn primary', onclick: () => run('approve1', { approve: true }) }, '✅ อนุมัติ' + w.ask),
    h('button', { class: 'btn red', onclick: () => { const n = prompt('เหตุผลที่ไม่อนุมัติ'); if (n !== null) run('approve1', { approve: false, note: n }); } }, 'ไม่อนุมัติ')));
  if (can.print) acts.append(h('button', { class: 'btn blue full', onclick: () => openExternal(res.printUrl) },
    r.prints ? `🖨️ พิมพ์ซ้ำ (จะขึ้น "สำเนา")` : '🖨️ พิมพ์' + w.doc),
    h('div', { class: 'hint' }, 'แนะนำให้เปิดจากคอมพิวเตอร์ที่ต่อเครื่องพิมพ์ (เปิด LINE บนคอมแล้วกดปุ่มนี้)'));
  if (can.buy) acts.append(h('button', { class: 'btn primary full', onclick: () => go('buy', r.id) }, w.start));
  if (can.receive) acts.append(h('button', { class: 'btn blue full', onclick: () => go('receive', r.id) }, w.recv),
    repair ? h('div', { class: 'hint' }, 'ทำในมือถือ — ต้องถ่ายรูปหลังซ่อมตอนรับของจริง') : null);
  if (can.approve2) acts.append(
    h('div', { class: 'info' }, '💵 ' + res.settlePreview.text),
    h('div', { class: 'actions two' },
      h('button', { class: 'btn primary', onclick: () => run('approve2', { approve: true }) }, '✅ ปิดรายการ'),
      h('button', { class: 'btn line', onclick: () => { const n = prompt('ส่งกลับให้ตรวจใหม่เพราะ'); if (n !== null) run('approve2', { approve: false, note: n }); } }, '↩️ ส่งกลับตรวจใหม่')));
  // การเงินขั้นที่ 1 — จ่ายเงินเบิกล่วงหน้าก่อนออกไปซื้อ (แก้ยอดได้ถ้าจ่ายจริงไม่เท่ากับที่ขอเบิก)
  if (can.cash1) {
    const amt = h('input', { type: 'number', inputmode: 'decimal', min: '0', step: '0.01', value: String(r.advance || '') });
    acts.append(
      h('div', { class: 'info' }, `💵 จ่ายเงินเบิกให้ ${r.buyer} — ยอดที่ขอเบิก ${fmt(r.advance)} บาท`),
      h('label', {}, 'จำนวนเงินที่จ่ายจริง (บาท)', amt),
      h('button', { class: 'btn primary full', onclick: () => {
        const v = Number(amt.value);
        if (!(v > 0)) return toast('กรุณาใส่จำนวนเงินที่จ่ายจริง');
        if (confirm(`ยืนยันว่าจ่ายเงิน ${fmt(v)} บาท ให้ ${r.buyer} แล้ว?`)) run('cashPre', { amount: v }, 'กำลังบันทึกการจ่ายเงิน…');
      } }, '💵 จ่ายเงินเบิกแล้ว'));
  }
  // การเงินขั้นที่ 2 — รับเงินทอนคืน / จ่ายเพิ่ม / คืนเงินสำรองจ่าย แล้วส่งให้ผู้บริหารปิดงาน
  if (can.cash2) acts.append(h('div', { class: 'info' }, '💵 ' + (r.settle || res.settlePreview.text)),
    h('button', { class: 'btn primary full', onclick: () => {
      if (confirm(`ยืนยันว่าทำรายการเงินนี้แล้ว?\n${r.settle || res.settlePreview.text}`)) run('cashPost', {}, 'กำลังบันทึกการเคลียร์เงิน…');
    } }, '✅ จ่าย/รับเงินเรียบร้อยแล้ว'));
  if (can.cancel) acts.append(h('button', { class: 'btn line full', onclick: () => { const n = prompt('เหตุผลที่ยกเลิกใบนี้'); if (n) run('cancel', { reason: n }); } }, 'ยกเลิก' + w.doc));
  Object.values(can.why || {}).forEach((w) => acts.append(h('div', { class: 'warn' }, '🔒 ' + w)));
  if (res.evidenceUrl) acts.append(h('button', { class: 'btn ghost full', onclick: () => openExternal(res.evidenceUrl) }, '📂 หน้าหลักฐานทั้งหมด (ลิงก์เดียวกับในไฟล์บัญชี)'));
  if (res.verifyUrl) acts.append(h('div', { class: 'hint' }, h('a', { href: res.verifyUrl, target: '_blank' }, 'หน้าตรวจสอบ (ที่ร้านเห็นเมื่อสแกน QR)')));
  if (acts.children.length) app.append(h('section', { class: 'card' }, acts));

  // ประวัติ: ใครทำอะไร เมื่อไร (ผู้บริหาร/เสมียนทำแทนกันได้)
  if (res.log && res.log.length) app.append(h('section', { class: 'card' }, h('h2', {}, '🕘 ประวัติการทำงาน'),
    ...res.log.map((l) => h('div', { class: 'logrow' },
      h('div', { class: 'lt' }, l.at),
      h('div', {}, h('b', {}, l.action), ` — ${l.by}${l.role ? ' (' + l.role + ')' : ''}`, l.detail ? h('div', { class: 'hint' }, l.detail) : null)))));
}

function linkThumbs(list) {
  return h('div', { class: 'thumbs' }, ...list.map((p) => h('div', { class: 'thumb' },
    h('a', { href: p.url, target: '_blank', rel: 'noopener' }, h('img', { src: p.thumb, alt: '' })))));
}
function openExternal(url) {
  if (!MOCK && liff.isInClient()) liff.openWindow({ url, external: true }); else window.open(url, '_blank');
}

    if (isRepair(r)) {
      // ใบซ่อม: ถ่ายรูปก่อนซ่อม (ที่โรงงาน) แล้วนำใบไปให้ร้าน/ช่าง
      app.append(info,

    bindCameraButtons({ bill: 'บิลร้าน', goods: 'ของที่ร้าน' });

  };
  render();

}

async function submitBuy() {
  if (!state.photos.bill.length) { document.querySelector('[data-cam=bill]').scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('🧾 ' + t('needBill'), 4000); }
  if (!state.photos.goods.length) { document.querySelector('[data-cam=goods]').scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('📦 ' + t('needGoods'), 4000); }
  if (!state.location) await requestLocation();
  $('submitBtn').disabled = true; overlay(true, t('sending'));
  try {
    await api('bought', { data: { id: state.record.id, location: state.location, billImages: state.photos.bill, goodsImages: state.photos.goods } });
    showDone('✅', t('done'), state.record.id, '🏭 ' + t('doneSub'));
  } catch (err) { toast(t('err') + ' — ' + err.message, 6000); }
  finally { overlay(false); $('submitBtn').disabled = false; }
}

async function submitRepairStart() {
  if (!state.photos.before.length) { document.querySelector('[data-cam=before]').scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('📷 ' + t('needBefore'), 4000); }
  if (!state.location) await requestLocation();

  try {
    await api('bought', { data: { id: state.record.id, location: state.location, beforeImages: state.photos.before } });

  } catch (err) { toast(t('err') + ' — ' + err.message, 6000); }
  finally { overlay(false); $('submitBtn').disabled = false; }
}

/** สูตรเดียวกับ settlement_() ฝั่งเซิร์ฟเวอร์ — ไว้แสดงตัวอย่างก่อนบันทึก */
function settleText(r, total) {
  if (r.payment === PAY.ADVANCE) {
    const d = Math.round((r.advance - total) * 100) / 100;
    if (d > 0) return `${r.buyer} คืนเงินทอน ${fmt(d)} บาท (เบิก ${fmt(r.advance)} − จ่ายจริง ${fmt(total)})`;
    if (d < 0) return `บริษัทจ่ายเพิ่มให้ ${r.buyer} ${fmt(-d)} บาท (ใช้เกินเงินเบิก)`;
    return 'เงินเบิกพอดี ไม่มีเงินทอน';
  }
  if (r.payment === PAY.SELF) return `คืนเงินให้ ${r.buyer} ${fmt(total)} บาท (สำรองจ่าย)`;
  return `วางบิล — รอใบแจ้งหนี้จาก ${r.vendor}`;
}

/* ================== ตำแหน่ง GPS ================== */
function showGps() {
  const el = $('gps'); if (!el) return;
  if (state.location) { el.className = 'gps ok'; el.textContent = `📍 ${t('gpsOk')} (±${Math.round(state.location.acc)} ม.)`; el.onclick = null; }
  else if (state.gpsFailed) { el.className = 'gps bad'; el.textContent = '📍 ' + t('gpsBad'); el.onclick = requestLocation; }
}
function requestLocation() {
  if (!navigator.geolocation) { state.gpsFailed = true; showGps(); return Promise.resolve(); }
  return new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition((pos) => {
      state.location = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      state.gpsFailed = false; showGps(); resolve();

let camTarget = null, camLabels = {};
function bindCameraButtons(labels) {
  camLabels = labels;

$('camInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !camTarget) return;
  overlay(true, '…');
  try {
    const takenAt = file.lastModified || Date.now();
    const dataUrl = await processImage(file, camLabels[camTarget] || camTarget, new Date());
    state.photos[camTarget].push({ dataUrl, takenAt });
    renderThumbs(camTarget);
    if (Date.now() - takenAt > 30 * 60000) toast('⚠️ ' + t('old'), 4000);
    const step = document.querySelector(`[data-cam=${camTarget}]`)?.closest('.card')?.querySelector('.step');
    if (step) step.classList.add('done');
  } catch (err) { toast(err.message); } finally { overlay(false); }
};
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ไฟล์รูปไม่รองรับ')); };
    img.src = url;
  });
}
/** ย่อรูป + ประทับ เลขใบสั่ง / ประเภทรูป / ชื่อ / วันเวลา / GPS ลงบนรูป */
async function processImage(file, label, when) {
  const img = await loadImage(file);
  const scale = Math.min(1, IMG_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale), hh = Math.round(img.naturalHeight * scale);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
  const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, hh);
  const fs = Math.max(14, Math.round(w / 32));
  const loc = state.location ? `GPS ${state.location.lat.toFixed(5)}, ${state.location.lng.toFixed(5)}` : 'GPS: -';
  const lines = [`SKS • ${state.record ? state.record.id : ''} • ${label}`,
    `${state.profile.displayName} • ${when.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'medium' })}`, loc];
  const pad = Math.round(fs * 0.6), lh = Math.round(fs * 1.35), bh = lh * lines.length + pad * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, hh - bh, w, bh);
  ctx.fillStyle = '#fff'; ctx.font = `600 ${fs}px Sarabun, sans-serif`; ctx.textBaseline = 'top';
  lines.forEach((s, i) => ctx.fillText(s, pad, hh - bh + pad + i * lh, w - pad * 2));
  return cv.toDataURL('image/jpeg', IMG_QUALITY);
}
function renderThumbs(key) {
  const box = $('th_' + key); if (!box) return; box.innerHTML = '';
  state.photos[key].forEach((p, i) => box.append(h('div', { class: 'thumb' }, h('img', { src: p.dataUrl, alt: '' }),
    h('button', { type: 'button', 'aria-label': 'ลบรูป', onclick: () => { state.photos[key].splice(i, 1); renderThumbs(key); } }, '×'))));
}
